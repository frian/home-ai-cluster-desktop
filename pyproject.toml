[project]
name = "home-ai-cluster-desktop"
version = "0.1.0"
description = "Independent desktop client for Home AI Cluster."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.15"
dependencies = ["PySide6-Essentials>=6.10,<7"]

[project.urls]
Repository = "https://github.com/frian/home-ai-cluster-desktop"
Issues = "https://github.com/frian/home-ai-cluster-desktop/issues"

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/home_ai_cluster_desktop"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
